<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <link rel="shortcut icon" href="/ClientAndServerApplication/html/assets/images/logo5.png" type="image/x-icon">
  <meta name="description" content="">
  <title>Chat Page</title>
  <link rel="stylesheet" href="/ClientAndServerApplication/html/assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/ClientAndServerApplication/html/assets/theme/css/style.css">
  <link rel="preload" href="https://fonts.googleapis.com/css?family=Inter+Tight:100,200,300,400,500,600,700,800,900,100i,200i,300i,400i,500i,600i,700i,800i,900i&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter+Tight:100,200,300,400,500,600,700,800,900,100i,200i,300i,400i,500i,600i,700i,800i,900i&display=swap"></noscript>
  <link rel="stylesheet" href="/ClientAndServerApplication/html/assets/mobirise/css/mbr-additional.css?v=HCMNay" type="text/css">
</head>
<body>

  <section data-bs-version="5.1" class="header14 cid-vwvE80AC2m" id="header14-1">
    <div class="container">
      <div class="row justify-content-center">
        <div class="card col-12 col-md-12 col-lg-8">
          <div class="card-wrapper">
            <div class="card-box align-center">
              <h1 class="card-title mbr-fonts-style mb-4 display-1"><strong>CHAT PAGE</strong></h1>
              <p class="mbr-text mbr-fonts-style mb-4 display-7">Página de chat en vivo</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-bs-version="5.1" class="article07 cid-vwvEwEZgIx" id="article19-2">
    <div class="container">
      <div class="row justify-content-center">
        <div class="card col-md-12 col-lg-10">
          <div class="card-wrapper">
            <div class="card-box align-left mt-4">
              <div class="mbr-text counter-container mbr-fonts-style display-7">
                <!-- Los mensajes se añaden aquí desde ChatController.js -->
                <ul id="msgList"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section data-bs-version="5.1" class="form5 cid-vwvE3SPWpW" id="form02-0">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 content-head">
          <div class="mbr-section-head mb-5">
            <h3 class="mbr-section-title mbr-fonts-style align-center mb-0 display-2"><strong>Mensajes</strong></h3>
          </div>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-lg-8 mx-auto mbr-form">
          <!-- Sin action ni method: el formulario no navega a ninguna otra página -->
          <form id="chatForm" >
            <div class="dragArea row">
              <div class="col-md col-sm-12 form-group mb-3">
                <textarea name="mensaje" placeholder="Mensaje" class="form-control" id="msgText"></textarea>
              </div>
              <div class="col-lg-12 col-md-12 col-sm-12 align-center mbr-section-btn">
                <!-- type="button" evita que el botón envíe el formulario -->
                <button type="button" class="btn btn-primary display-7" id="sendButton">Send message</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="/ClientAndServerApplication/js/ChatController.js"></script>  
  <script src="/ClientAndServerApplication/html/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/ClientAndServerApplication/html/assets/theme/js/script.js"></script>
  

</body>
</html>
